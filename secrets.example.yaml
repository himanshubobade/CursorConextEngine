# Copy to secrets.yaml (gitignored) and fill in. Every value can also be
# supplied as an environment variable instead - the env var always wins.

databricks:
  # env: DATABRICKS_SERVER_HOSTNAME
  server_hostname: adb-1234567890123456.7.azuredatabricks.net
  # env: DATABRICKS_HTTP_PATH  -- the warehouse id is taken from the tail
  http_path: /sql/1.0/warehouses/abcdef1234567890
  # env: DATABRICKS_TOKEN
  token: dapiXXXXXXXXXXXXXXXXXXXXXXXXXXXX

llm:
  # env: ANTHROPIC_API_KEY
  anthropic_api_key: sk-ant-...
  # env: OPENAI_API_KEY  -- also used for embeddings
  openai_api_key: sk-...
  # env: GOOGLE_API_KEY
  google_api_key: AIza...
