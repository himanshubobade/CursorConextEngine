# Model registry. Adding a model is a config edit, not a code change - the UI
# picker and the cost meter are both driven off this file.
#
# input / output / cache_write / cache_read are USD per 1,000,000 tokens.
# Prices drift; update them here rather than anywhere in the code.

models:
  - id: claude-sonnet-4-5
    provider: anthropic
    api_model: claude-sonnet-4-5-20250929
    label: Claude Sonnet 4.5
    context_window: 200000
    max_output_tokens: 16000
    supports_tools: true
    supports_prompt_cache: true
    input: 3.00
    output: 15.00
    cache_write: 3.75
    cache_read: 0.30

  - id: claude-opus-4-1
